<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Precious Earth</title>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Anuphan:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky journey bar (four level-colored segments + score) over one activity card at a time. Dark-first starfield; each level owns a color that tags its cards. */
/* Layout: sticky journey bar (four level-colored segments + score) over one activity card at a time. Neon-city night theme; each level owns a color. */
:root{
  --bg:#07130f; --dot:#0e2219; --surf:#0d1f17; --surf2:#15301f; --line:#2b5340;
  --ink:#eaf7ee; --soft:#94bba4;
  --l1:#4be3a6; --l2:#ffd23f; --l3:#ff7a59; --l4:#46c9ff; --l5:#b49bff;
  --on:#07130f;
  --good:#5df0a8; --bad:#ff7b8a; --goodbg:#0f3b2b; --badbg:#44202a;
  --display:"Unbounded","Anuphan",system-ui,sans-serif;
  --body:"Anuphan",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f0f7ef; --dot:#dcebd9; --surf:#ffffff; --surf2:#e4f1e3; --line:#c3d9c4;
    --ink:#10261a; --soft:#4a6a56;
    --l1:#1fae75; --l2:#f2b705; --l3:#f0643a; --l4:#1aa6e0; --l5:#8f74e8;
    --good:#0b7d4c; --bad:#c7303a; --goodbg:#d6f2e2; --badbg:#ffe1e3;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f0f7ef; --dot:#dcebd9; --surf:#ffffff; --surf2:#e4f1e3; --line:#c3d9c4;
  --ink:#10261a; --soft:#4a6a56;
  --l1:#1fae75; --l2:#f2b705; --l3:#f0643a; --l4:#1aa6e0; --l5:#8f74e8;
  --good:#0b7d4c; --bad:#c7303a; --goodbg:#d6f2e2; --badbg:#ffe1e3;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:linear-gradient(var(--dot) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,var(--dot) 1px,transparent 1px) 0 0/34px 34px,var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--l5);outline-offset:2px}
p{margin:0}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.soft{color:var(--soft)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.top .row1{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px}
.brand{font-family:var(--display);font-weight:800;font-size:1.25rem;text-decoration:none;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--l3);box-shadow:0 0 0 4px color-mix(in srgb,var(--l3) 25%,transparent)}
.who{display:inline-flex;align-items:center;gap:8px;max-width:60%;min-height:34px;padding:2px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surf);text-decoration:none;font-weight:600;font-size:.88rem}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who b{font-family:var(--mono);font-size:.82rem;background:var(--l4);color:var(--on);border-radius:999px;padding:0 8px;flex:none}
.journey{display:grid;grid-template-columns:repeat(4,1fr) .8fr;gap:6px;padding:10px 0 10px}
.seg{display:flex;flex-direction:column;gap:5px;text-decoration:none;min-width:0}
.seg .track{display:block;height:8px;border-radius:99px;background:var(--surf2);overflow:hidden}
.seg .track i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .3s}
.seg .lbl{display:flex;align-items:baseline;gap:5px;font-size:.74rem;color:var(--soft);font-weight:600;min-width:0}
.seg .lbl b{font-family:var(--mono);font-size:.78rem;color:var(--ink)}
.seg .lbl em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.cur .track{height:10px;box-shadow:0 0 0 2px var(--c)}
.seg.cur .lbl{color:var(--ink)}
.seg:hover .lbl{color:var(--ink)}

main{padding-block:22px 110px}

/* shared */
.card{background:var(--surf);border:1px solid var(--line);border-radius:24px;padding:22px}
.tag{display:inline-flex;align-items:center;font-family:var(--mono);font-weight:700;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--pc,var(--l4));color:var(--on)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 22px;border:0;border-radius:999px;background:var(--pc,var(--l4));color:var(--on);font-weight:700;cursor:pointer;text-decoration:none;transition:transform .1s,filter .1s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--soft)}
.btn.sm{min-height:36px;padding:4px 16px;font-size:.9rem}
.btn:disabled{opacity:.4;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.fb{margin-top:14px;font-weight:600;min-height:1.4em}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.opt{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:8px 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--surf2);font-weight:600;cursor:pointer;text-align:left}
.opt:hover{border-color:var(--soft)}
.opt.on,.opt[aria-pressed="true"]{background:var(--pc);color:var(--on);border-color:var(--pc)}
.opt.ok{background:var(--goodbg);border-color:var(--good);color:var(--ink)}
.opt.no{background:var(--badbg);border-color:var(--bad);color:var(--ink)}
.opt[disabled]{opacity:.45;cursor:default}
.opt.ok[disabled],.opt.no[disabled]{opacity:1}
.opt b{font-family:var(--mono);font-size:.85rem;flex:none}
input[type=text],input[type=number],select,textarea{width:100%;min-height:46px;padding:8px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surf2);font-weight:500}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem;color:var(--soft)}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes pop{50%{transform:scale(1.05)}}
.shake{animation:shake .35s}.pop{animation:pop .3s}
.hint{font-size:.85rem;color:var(--soft)}

/* step page */
.partline{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.partline .pname{font-weight:700}
.partline em{font-style:normal;color:var(--soft);font-weight:500}
.dots{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.dots::-webkit-scrollbar{display:none}
.dot{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:2px 12px;border:1.5px solid var(--line);border-radius:999px;text-decoration:none;font-size:.82rem;font-weight:600;color:var(--soft);background:var(--surf)}
.dot b{font-family:var(--mono)}
.dot.done::after{content:"✓";color:var(--good);font-weight:800}
.dot.cur{background:var(--pc);border-color:var(--pc);color:var(--on)}
.dot.cur.done::after{color:var(--on)}
.shead{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.stag{flex:none;min-width:46px;height:46px;padding:0 10px;display:grid;place-items:center;border-radius:14px;background:var(--pc);color:var(--on);font-family:var(--mono);font-weight:700;font-size:1.05rem}
.shead h2{font-size:clamp(1.6rem,4.5vw,2.2rem);font-weight:800}
.shead .th{margin-top:6px;color:var(--soft);font-weight:500}
.scorenote{margin-top:20px;padding-top:14px;border-top:1px dashed var(--line);font-size:.84rem;color:var(--soft)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.pager .btn{flex:0 1 auto;max-width:100%}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px;align-items:start}
.hero h1{font-size:clamp(3rem,9vw,5.6rem);font-weight:800;letter-spacing:-.03em;margin-top:14px}
.hero h1 u{text-decoration:none;background:linear-gradient(transparent 62%,var(--l3) 62%,var(--l3) 90%,transparent 90%);color:var(--ink)}
.lead{margin-top:16px;font-size:1.08rem;color:var(--soft);max-width:34rem}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:22px;max-width:25rem}
.bub{padding:9px 16px;border-radius:20px;font-weight:500;font-size:.95rem;max-width:88%}
.bub.me{align-self:flex-end;background:var(--l5);color:var(--on);border-bottom-right-radius:6px}
.bub.ai{align-self:flex-start;background:var(--surf2);border:1px solid var(--line);border-bottom-left-radius:6px}
.idcard{margin-top:22px;display:flex;flex-direction:column;gap:14px;max-width:31rem}
.idgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.idgrid .wide{grid-column:1/-1}
.map{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.map a{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:20px;background:var(--surf);text-decoration:none;transition:transform .12s,border-color .12s}
.map a:hover{transform:translateX(4px);border-color:var(--c)}
.map .n{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--on);font-family:var(--display);font-weight:800;font-size:1.3rem}
.map b{display:block;font-family:var(--display);font-size:1.15rem;line-height:1.1}
.map span.t{display:block;color:var(--soft);font-size:.86rem;margin-top:2px}
.map .meta{margin-left:auto;font-family:var(--mono);font-size:.74rem;color:var(--soft);text-align:right;flex:none}
.rules{margin-top:36px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.rules .card{padding:16px 18px}
.rules h3{font-size:1.05rem;margin-bottom:6px}
.rules p{color:var(--soft);font-size:.9rem}

/* word cards */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.wcard{padding:14px 16px;border:1px solid var(--line);border-radius:20px;background:var(--surf2);display:flex;flex-direction:column;gap:8px;min-width:0}
.wcard.heard{border-color:var(--good)}
.wcard.heard .wn{background:var(--good)}
.wcard.heard .wn::after{content:"✓";margin-left:3px}
.vw.got{background:color-mix(in srgb,var(--good) 35%,transparent);border-bottom-color:var(--good)}
.wcard header{display:flex;align-items:flex-start;gap:12px}
.wn{flex:none;min-width:30px;height:30px;padding:0 6px;border-radius:10px;display:grid;place-items:center;background:var(--pc);color:var(--on);font-family:var(--mono);font-weight:700;font-size:.8rem}
.wt{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.wt b{font-family:var(--display);font-size:1.5rem;line-height:1.05;overflow-wrap:anywhere}
.pos{font-family:var(--mono);font-size:.75rem;color:var(--soft)}
.ipa{flex-basis:100%;font-family:var(--mono);font-size:.82rem;color:var(--soft)}
.wsp{display:flex;gap:6px;flex:none}
.spk{width:38px;height:38px;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--surf);cursor:pointer}
.spk:hover{background:var(--pc);color:var(--on);border-color:var(--pc)}
.spk svg{width:17px;height:17px;fill:currentColor}
.spk.slow{width:auto;padding:0 12px;border-radius:999px;font-family:var(--mono);font-size:.72rem;font-weight:700}
.wth{font-size:1.1rem;font-weight:600}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:2px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surf);font-weight:600;font-size:.9rem}
.chip i{font-style:normal;font-family:var(--mono);font-weight:800}
button.chip{cursor:pointer;color:inherit}
button.chip:hover{background:var(--surf2)}
.chip svg{width:15px;height:15px;fill:currentColor;opacity:.7;flex:none}
.chip.syn{border-color:var(--l4)}.chip.syn i{color:var(--good)}
.chip.ant{border-color:var(--l1)}.chip.ant i{color:var(--bad)}
.wcard .ex{font-size:.88rem;color:var(--soft);font-style:italic}
.wcard .ex b{color:var(--ink);font-style:normal}
.wpanel{position:sticky;top:var(--stk,120px);z-index:30;max-height:42vh;overflow-y:auto;padding:14px;border:1.5px solid var(--pc,var(--l3));border-radius:22px;margin-bottom:18px;background:var(--surf);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.wpanel .wcard{border:0;background:transparent;padding:2px}
.wpanel .empty{color:var(--soft);font-weight:600;padding:8px 4px}

/* match */
.prog{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-weight:700;font-size:.85rem;margin-bottom:14px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--surf2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pc);width:0;transition:width .25s}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mb{min-height:52px;padding:6px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surf2);font-weight:600;cursor:pointer;overflow-wrap:anywhere;min-width:0}
.mb.sel{background:var(--pc);color:var(--on);border-color:var(--pc)}
.mb.done{background:var(--goodbg);border-color:var(--good);pointer-events:none}
.mb.bad{background:var(--badbg);border-color:var(--bad)}

/* passage */
.passage .para{margin-top:16px}
.passage .para:first-of-type{margin-top:0}
.plabel{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin-bottom:4px}
.lis{min-height:28px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surf2);font-family:var(--mono);font-size:.7rem;font-weight:700;cursor:pointer;text-transform:uppercase}
.lis:hover{background:var(--pc);color:var(--on);border-color:var(--pc)}
.passage p{font-size:1.06rem;line-height:1.85}
.s{border-radius:4px}
.s.hl{background:color-mix(in srgb,var(--l3) 40%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--l3) 40%,transparent)}
.vw{padding:0 2px;border:0;border-bottom:2px solid var(--pc);border-radius:4px 4px 0 0;background:color-mix(in srgb,var(--pc) 24%,transparent);font:inherit;color:inherit;cursor:pointer}
.vw:hover,.vw.on{background:var(--pc);color:var(--on)}
.ptitle{font-size:1.6rem;margin-bottom:14px}
.slbox{margin-top:20px;padding:16px 18px;border-radius:20px;background:var(--surf2);border:1.5px solid var(--l5)}
.slbox.hl{box-shadow:0 0 0 4px color-mix(in srgb,var(--l3) 50%,transparent);border-color:var(--l3)}
.slbox b{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase}
.slbox p{margin-top:6px}

/* questions */
.qcard{padding:16px 18px;border:1px solid var(--line);border-radius:20px;background:var(--surf2);margin-bottom:14px}
.qcard .qh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.qcard .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--pc);color:var(--on);font-family:var(--mono);font-weight:700;font-size:.85rem;flex:none}
.qcard .qt{font-family:var(--mono);font-size:.76rem;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
.qcard .qx{font-weight:600;font-size:1.08rem;margin-bottom:10px}
.qopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:8px}
.qopts .opt{background:var(--surf);justify-content:center}
.why{margin-top:10px;font-size:.92rem;padding:10px 12px;border-radius:12px;background:var(--surf)}
.why .btn{margin-top:8px}

/* score */
.report{padding:0;overflow:hidden}
.rtop{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);background:var(--surf2)}
.rtop h2{font-size:1.5rem}
.stamp{font-family:var(--mono);font-size:.8rem;color:var(--soft)}
.rwho{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;padding:18px 22px}
.rbig{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px;padding:6px 22px 22px}
.rbig .num{font-family:var(--display);font-weight:800;font-size:clamp(3.6rem,12vw,5.6rem);line-height:.95;letter-spacing:-.03em}
.rbig .num small{font-size:.38em;color:var(--soft);font-weight:600;letter-spacing:0}
.rbig .pct{font-family:var(--mono);font-weight:700;font-size:1.4rem}
.rank{display:inline-block;margin-top:6px;padding:4px 14px;border-radius:999px;background:var(--l3);color:var(--on);font-weight:700}
.rparts{display:flex;flex-direction:column;gap:12px;padding:0 22px 22px}
.rp{display:grid;grid-template-columns:minmax(0,12rem) 1fr auto;gap:12px;align-items:center}
.rp b{font-size:.92rem}
.rp .bar{height:12px}
.rp .bar i{background:var(--c)}
.rp .sc{font-family:var(--mono);font-weight:700;font-size:.9rem;white-space:nowrap}
.rlist{border-top:1px solid var(--line)}
.rl{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 22px;border-bottom:1px solid var(--line);font-size:.92rem}
.rl:last-child{border-bottom:0}
.rl .tg{width:34px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--c);color:var(--on);font-family:var(--mono);font-weight:700;font-size:.72rem}
.rl .pt{font-family:var(--mono);font-weight:700}
.rl .st{font-size:.76rem;color:var(--soft);min-width:3.4rem;text-align:right}
.rl.miss .pt{color:var(--soft)}
.todo{margin:16px 0;padding:14px 18px;border-radius:18px;border:1.5px solid var(--l3);background:color-mix(in srgb,var(--l3) 14%,transparent);font-weight:600}
.todo a{text-decoration:underline}
.shot{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.shot .card{padding:16px 18px}
.shot h3{font-size:1.05rem;margin-bottom:6px}

/* passage sheet */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:35;min-height:50px;padding:0 22px;border:0;border-radius:999px;background:var(--l3);color:var(--on);font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.sheet{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end;align-items:flex-end}
.sheet .scrim{position:absolute;inset:0;background:rgba(5,8,14,.6)}
.sheet .panel{position:relative;width:min(480px,100%);max-height:86%;display:flex;flex-direction:column;background:var(--surf);border:1px solid var(--line);border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .ph{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet .pb{overflow-y:auto;padding:18px}
@media (min-width:900px){
  .sheet{align-items:stretch}
  .sheet .panel{max-height:none;height:100%;border-radius:24px 0 0 24px}
}

@media (max-width:760px){

var EXFORMS=new RegExp('\\b(?:global warming|climate change|acid rain|air pollution|water pollution|deforestation|garbage|recycl(?:e|es|ed|ing)|endangered animals?|environment(?:al)?)\\b','i');
function evalSentence(comp){
  var t=comp.trim().replace(/[.!?]+$/,'');
  var words=t.split(/\s+/).filter(Boolean);
  var vocab=EXFORMS.test(t);
  var ok=false,reason='';
  var skip={not:1,also:1,always:1,never:1,probably:1,soon:1,still:1,even:1,all:1,just:1,really:1};
  var i=0;while(i<words.length&&skip[words[i].toLowerCase()])i++;
  var w=(words[i]||'').toLowerCase();
  if(words.length<3){reason='ประโยคสั้นเกินไป เขียนให้ครบอย่างน้อย 3 คำ';}
  else if(!/^[a-z]+$/.test(w)){reason='หลัง should ควรเป็นคำกริยาภาษาอังกฤษ';}
  else if(/^(is|are|was|were|am|to|has|have|had|does|do|did)$/.test(w)&&w!=='have'&&w!=='do'){reason='หลัง should ใช้กริยาช่องที่ 1 ไม่ต้องมี is/are/to';}
  else if(/(ing|ed)$/.test(w)){reason='หลัง should ใช้กริยาช่องที่ 1 ไม่เติม -ing/-ed';}
  else if(/s$/.test(w)&&!/(ss|us)$/.test(w)){reason='หลัง should ใช้กริยาช่องที่ 1 ไม่เติม -s';}
  else ok=true;
  return {vocab:vocab,will:ok,reason:reason};
}
VIEW.e1=function(b){
  var D=act('e1').data;
  b.innerHTML='<p class="hint" style="margin-bottom:12px">เติมประโยคให้จบ ใช้ <b>คำศัพท์ใหม่</b> อย่างน้อย 1 คำ (แตะจากคลังคำเพื่อเติม หรือพิมพ์เอง) และใช้กริยาช่องที่ 1 หลัง should</p><div class="ex"><span class="exp">To protect the Earth, we should</span><input type="text" id="exi" maxlength="90" autocomplete="off" placeholder="… your idea …" aria-label="Finish the sentence"></div><div class="wbox" id="xb"></div><div class="row"><button class="btn" id="ck" type="button" style="--pc:var(--l4)">Check my sentence</button><button class="btn ghost sm" id="sp" type="button">Listen</button></div><div id="rs" aria-live="polite"></div>';
  var inp=$('#exi',b),xb=$('#xb',b),rs=$('#rs',b);
  inp.value=D.text||'';
  V.forEach(function(v){
    var c=el('button','wc',esc(v.id==='ai'?'artificial intelligence':v.w));c.type='button';
    c.addEventListener('click',function(){inp.value=(inp.value.trim()?inp.value.replace(/\s*$/,' '):'')+c.textContent;inp.focus();});
    xb.appendChild(c);
  });
  function show(r,first){
    var a=act('e1');
    rs.innerHTML='<div class="checks"><div class="chk '+(r.vocab?'ok':'no')+'"><b>'+(r.vocab?'✓':'✗')+'</b> ใช้คำศัพท์ใหม่จากบทเรียน</div><div class="chk '+(r.will?'ok':'no')+'"><b>'+(r.will?'✓':'✗')+'</b> ใช้ should ถูกต้อง'+(r.will?'':' · '+esc(r.reason||'ตรวจประโยคอีกครั้ง'))+'</div></div><p class="fb '+(a.score===2?'ok':'')+'">'+(first?'คะแนนครั้งแรกถูกบันทึกแล้ว: '+a.score+' / 2':'คะแนนที่บันทึก (ครั้งแรก): '+a.score+' / 2')+'</p>';
  }
  $('#ck',b).addEventListener('click',function(){
    var comp=inp.value;
    if(comp.trim().length<2){rs.innerHTML='<p class="fb no">เขียนประโยคก่อนนะ</p>';return;}
    D.text=comp;persist();
    var r=evalSentence(comp);
    var first=act('e1').score==null;
    grade('e1',(r.vocab?1:0)+(r.will?1:0),2);
    show(r,first);
  });
  $('#sp',b).addEventListener('click',function(){speak('To protect the Earth, we should '+inp.value,.8);});
  if(act('e1').score!=null)show(evalSentence(inp.value),false);
};

/* ---------- step page ---------- */
function renderStep(id){
  var step=stepOf(id),part=PARTS[step.part-1],i=ORDER.indexOf(id);
  var wrap=el('div','page');wrap.style.setProperty('--pc','var('+part.c+')');
  wrap.innerHTML='<div class="partline"><span class="tag">Level '+part.n+'</span><span class="pname">'+esc(part.en)+' <em>· '+part.th+'</em></span></div><nav class="dots" id="dots" aria-label="Activities in this level"></nav><section class="card"><header class="shead"><span class="stag">'+step.tag+'</span><div><h2>'+esc(step.title)+'</h2><p class="th">'+esc(step.th)+'</p></div></header><div id="sb"></div>'+(step.max?'<p class="scorenote">คะแนนเต็ม '+step.max+' · นับจากคำตอบแรกเท่านั้น</p>':'')+'</section><div class="pager" id="pg"></div>';
  app.appendChild(wrap);
  var prev=ORDER[i-1],next=ORDER[i+1];
  $('#pg',wrap).innerHTML='<a class="btn ghost" href="#'+prev+'">← '+esc(routeTitle(prev))+'</a><a class="btn" href="#'+next+'">'+(next==='score'?'ดูรายงานคะแนน':esc(routeTitle(next)))+' →</a>';
  VIEW[id]($('#sb',wrap),step);
  drawDots($('#dots',wrap),step);
}

/* ---------- skyline ---------- */
function skyline(){
  function tree(x,y,s,c){return '<path d="M'+x+' '+(y-26*s)+'l'+(-9*s)+' '+(16*s)+'h'+(5*s)+'l'+(-7*s)+' '+(12*s)+'h'+(22*s)+'l'+(-7*s)+' '+(-12*s)+'h'+(5*s)+'z" style="fill:var('+c+')"/><rect x="'+(x-1.5*s)+'" y="'+(y+2*s)+'" width="'+(3*s)+'" height="'+(5*s)+'" style="fill:var(--line)"/>';}
  var h='<circle cx="508" cy="36" r="20" style="fill:var(--l2)"/>';
  h+='<path d="M0 120V84Q80 56 170 80T340 72T480 86T600 68V120z" style="fill:var(--surf2);stroke:var(--line)"/>';
  h+='<path d="M0 120V102Q110 82 220 100T420 94T600 102V120z" style="fill:var(--surf);stroke:var(--line)"/>';
  [[30,86,1,'--l1'],[70,84,.8,'--l1'],[120,80,1.1,'--l1'],[210,86,.9,'--l1'],[300,76,1.2,'--l1'],[360,80,.8,'--l1'],[430,88,1,'--l1'],[540,78,1.1,'--l1'],[575,84,.8,'--l1']].forEach(function(t){h+=tree(t[0],t[1],t[2],t[3]);});
  return '<svg class="sky" viewBox="0 0 600 120" preserveAspectRatio="xMidYMax slice" aria-hidden="true">'+h+'</svg>';
}

/* ---------- home ---------- */
function renderHome(){
  var p=el('div'),t=totals();
  var started=t.done>0&&S.last&&S.last!=='home'&&ORDER.indexOf(S.last)>0;
  p.innerHTML=
   '<section class="hero"><div>'+
   '<span class="tag" style="--pc:var(--l1)">M.3 · Environment</span>'+
   '<h1>Our <u>Precious</u> Earth</h1>'+
   '<p class="lead">ฟังและจับคู่คำศัพท์ 10 คำ เติมประโยค อ่านบทความสั้นๆ ตอบ True/False ตอบคำถามวัดความเข้าใจ และแต่งประโยคช่วยโลกของคุณเอง</p>'+
   '<div class="chat" aria-hidden="true"><div class="bub me">Is the Earth getting hotter?</div><div class="bub ai">Yes. We should protect it!</div></div>'+
   '<form class="card idcard" id="idf" autocomplete="off"><div class="idgrid">'+
   '<label class="field wide">Name · ชื่อ-นามสกุล<input type="text" id="nm" maxlength="60" placeholder="ใส่ชื่อก่อนเริ่มเล่น"></label>'+
   '<label class="field">Class · ห้อง<input type="text" id="cl" maxlength="12" placeholder="เช่น ม.3/2"></label>'+
   '<label class="field">No. · เลขที่<input type="number" id="no" min="1" max="99" inputmode="numeric"></label></div>'+
   '<div class="row" style="margin-top:0"><button class="btn" id="st" type="submit" style="--pc:var(--l1)">Start Level 1</button></div>'+
   '<p class="hint" id="hn"></p></form></div>'+
   '<ol class="map" id="mp"></ol></section>'+skyline()+
   '<section class="rules"><div class="card"><h3>ต้องฟังก่อน</h3><p>กดฟังคำศัพท์ให้ครบทั้ง 10 คำก่อน จึงจะปลดล็อกด่านจับคู่ความหมาย</p></div>'+
   '<div class="card"><h3>คะแนนเต็ม 27</h3><p>จับคู่ 10 · เติมคำ 5 · True/False 5 · ถาม-ตอบความเข้าใจ 5 · Exit Ticket 2 นับจากคำตอบแรกเท่านั้น เกณฑ์ผ่าน 22 คะแนน</p></div>'+
   '<div class="card"><h3>จบแล้วแคปส่งครู</h3><p>ไปที่หน้า Score Report แล้วแคปหน้าจอให้เห็นชื่อ คะแนน และวันเวลา</p></div></section>';
  app.appendChild(p);
  var nm=$('#nm',p),cl=$('#cl',p),no=$('#no',p),st=$('#st',p),hn=$('#hn',p);
  nm.value=S.name;cl.value=S.cls;no.value=S.no;
  function upd(){
    var ok=nm.value.trim().length>=2;
    st.disabled=!ok;st.textContent=started?'Continue':'Start Level 1';
    hn.textContent=ok?(started?'ทำต่อจากที่ค้างไว้ได้เลย':''):'ต้องใส่ชื่อก่อน คะแนนจึงจะขึ้นในรายงาน';
  }
  [nm,cl,no].forEach(function(f){f.addEventListener('input',function(){S.name=nm.value;S.cls=cl.value;S.no=no.value;persist();upd();chrome();});});
  $('#idf',p).addEventListener('submit',function(e){
    e.preventDefault();if(nm.value.trim().length<2)return;
    location.hash='#'+(started?S.last:'v1');
  });
  upd();
  var mp=$('#mp',p);
  PARTS.forEach(function(pt){
    var st2=STEPS.filter(function(s){return s.part===pt.n;});
    var mx=st2.reduce(function(a,s){return a+s.max;},0);
    var d=st2.filter(function(s){return S.acts[s.id]&&S.acts[s.id].done;}).length;
    var li=el('li');
    li.innerHTML='<a href="#'+st2[0].id+'" style="--c:var('+pt.c+')"><span class="n">'+pt.n+'</span><span><b>'+esc(pt.en)+'</b><span class="t">'+esc(pt.th)+'</span></span><span class="meta">'+d+'/'+st2.length+' done<br>'+(mx?mx+' pts':'')+'</span></a>';
    mp.appendChild(li);
  });
}

/* ---------- score ---------- */
function renderScore(){
  var t=totals(),pct=t.max?Math.round(t.got/t.max*100):0;
  var p=el('div');
  var undone=STEPS.filter(function(s){return !(S.acts[s.id]&&S.acts[s.id].done);});
  var h='';
  if(undone.length)h+='<div class="todo">ยังทำไม่ครบ '+undone.length+' กิจกรรม: '+undone.map(function(s){return '<a href="#'+s.id+'">'+esc(s.title)+'</a>';}).join(' · ')+'</div>';
  h+='<section class="card report" id="report"><div class="rtop"><div><span class="tag" style="--pc:var(--l1)">Our Precious Earth · อ23102</span><h2 style="margin-top:8px">Score Report</h2></div><span class="stamp">'+esc(stamp())+'</span></div>'+
   '<div class="rwho"><label class="field wide">Name<input type="text" id="sn" maxlength="60"></label><label class="field">Class<input type="text" id="sc" maxlength="12"></label><label class="field">No.<input type="number" id="so" min="1" max="99"></label></div>'+
   '<div class="rbig"><div class="num">'+t.got+'<small>/'+t.max+'</small></div><div><div class="pct">'+pct+'%</div><span class="rank">'+rankOf(pct)+'</span><div class="pass '+(t.got>=PASS?'yes':'')+'">'+(t.got>=PASS?'✓ ผ่านเกณฑ์ ('+PASS+'/'+t.max+')':'เกณฑ์ผ่าน '+PASS+'/'+t.max)+'</div></div></div><div class="rparts">';
  PARTS.forEach(function(pt){
    var all=STEPS.filter(function(s){return s.part===pt.n;});
    var st=all.filter(function(s){return s.max;});
    var mx=st.reduce(function(a,s){return a+s.max;},0),g=st.reduce(function(a,s){var x=S.acts[s.id];return a+(x&&x.score!=null?x.score:0);},0);
    h+='<div class="rp" style="--c:var('+pt.c+')"><b>'+pt.n+' · '+esc(pt.en)+'</b><div class="bar"><i style="width:'+Math.round(g/mx*100)+'%"></i></div><span class="sc">'+g+'/'+mx+'</span></div>';
  });
  h+='</div><div class="rlist">';
  STEPS.forEach(function(s){
    var a=S.acts[s.id],pt=PARTS[s.part-1];
    var has=a&&a.done,val;
    if(s.id==='v1')val=heardCount()+'/10 listened';
    else if(!s.max)val=has?'done':'—';
    else val=(a&&a.score!=null?a.score:'—')+'/'+s.max;
    h+='<div class="rl'+(has?'':' miss')+'" style="--c:var('+pt.c+')"><span class="tg">'+s.part+s.tag+'</span><span>'+esc(s.title)+'</span><span class="pt">'+val+'</span><span class="st">'+(a&&a.tries>1?a.tries+' tries':(has?'':'not yet'))+'</span></div>';
  });
  h+='</div></section>'+
   '<div class="shot"><div class="card"><h3>ส่งครูอย่างไร</h3><p class="soft">แคปหน้าจอการ์ด Score Report ให้เห็นชื่อ คะแนนรวม และวันเวลา แล้วส่งตามที่ครูกำหนด</p></div>'+
   '<div class="card"><h3>คัดลอกสรุปคะแนน</h3><p class="soft" style="margin-bottom:10px">ส่งเป็นข้อความได้ถ้าแคปหน้าจอไม่สะดวก</p><button class="btn sm" id="cp" type="button" style="--pc:var(--l5)">Copy summary</button> <span class="hint" id="cpm"></span></div>'+
   '<div class="card"><h3>เริ่มใหม่</h3><p class="soft" style="margin-bottom:10px">ลบคำตอบและคะแนนทั้งหมดในเครื่องนี้</p><div id="rs"><button class="btn ghost sm" id="r1" type="button">Reset all</button></div></div></div>';
  p.innerHTML=h;app.appendChild(p);
  var sn=$('#sn',p),sc=$('#sc',p),so=$('#so',p);sn.value=S.name;sc.value=S.cls;so.value=S.no;
  [sn,sc,so].forEach(function(f){f.addEventListener('input',function(){S.name=sn.value;S.cls=sc.value;S.no=so.value;persist();chrome();});});
  $('#cp',p).addEventListener('click',function(){
    var txt='Our Precious Earth · อ23102\n'+S.name+' · '+S.cls+' · No. '+S.no+'\nScore: '+t.got+'/'+t.max+' ('+pct+'%) · '+rankOf(pct)+'\nDone: '+t.done+'/'+t.count+' activities\n'+stamp();
    var m=$('#cpm',p);
    try{navigator.clipboard.writeText(txt).then(function(){m.textContent='คัดลอกแล้ว';},function(){m.textContent='คัดลอกไม่ได้ ให้แคปหน้าจอแทน';});}
    catch(e){m.textContent='คัดลอกไม่ได้ ให้แคปหน้าจอแทน';}
  });
  $('#r1',p).addEventListener('click',function(){
    var box=$('#rs',p);
    box.innerHTML='<p class="hint" style="margin-bottom:8px">ลบทุกอย่างและย้อนไปเริ่มใหม่ แน่ใจไหม?</p><button class="btn sm" id="r2" type="button" style="--pc:var(--bad)">Yes, reset</button> <button class="btn ghost sm" id="r3" type="button">Cancel</button>';
    $('#r3',p).addEventListener('click',function(){render();});
    $('#r2',p).addEventListener('click',function(){S={name:'',cls:'',no:'',acts:{},last:''};persist();location.hash='#home';render();});
  });
}

/* ---------- router ---------- */
function render(){
  stopSpeech();closeSheet();
  var r=(location.hash||'#home').slice(1);
  if(ORDER.indexOf(r)<0)r='home';
  if(r!=='home'&&!S.name.trim()){
    if(location.hash!=='#home'){location.hash='#home';return;}
    r='home';
  }
  curRoute=r;
  if(r!=='home'){S.last=r;persist();}
  app.replaceChildren();
  if(r==='home')renderHome();else if(r==='score')renderScore();else renderStep(r);
  fab.hidden=['f1','tf','cp','e1'].indexOf(r)<0;
  chrome();
  if(lastRoute!==r)window.scrollTo(0,0);
  lastRoute=r;
}
window.addEventListener('hashchange',render);
render();
})();

</script>
